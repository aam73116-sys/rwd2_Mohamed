<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport tag: makes the page scale correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Media Demo</title>

  <style>
  /* ========= BASE STYLES (MOBILE FIRST) =========
     These apply to small screens first; bigger screens
     are handled later with media queries. */

  /* body: resets spacing and sets the base font and background */
  body {
    margin: 0;                                  /* removes browser default margin */
    font-family: Arial, Helvetica, sans-serif;  /* clean readable font */
    line-height: 1.6;                           /* space between lines for readability */
    background: #f4f4f4;                         /* light grey base background */
  }

  /* .container: centers the content and limits how wide it gets */
  .container {
    max-width: 1100px;   /* stops content stretching too wide on big screens */
    margin: 40px auto;   /* auto left/right = centered horizontally */
    padding: 20px;       /* inner spacing */
  }

  /* Main heading, centered */
  h1 {
    text-align: center;
    margin: 0 0 8px;
  }

  /* Intro paragraph, centered */
  p.lead {
    text-align: center;
    margin: 0 0 18px;
    color: #333;         /* dark grey, softer than pure black */
  }

  /* ========= RESPONSIVE IMAGE =========
     width 100% + height auto makes the image shrink with
     the container and keep its shape (never overflow). */
  .rwd-img {
    width: 100%;         /* fills the container width */
    height: auto;        /* keeps the original aspect ratio */
    display: block;      /* removes the small gap under inline images */
    border-radius: 12px; /* soft rounded corners */
    margin-bottom: 18px;
  }

  /* ========= RESPONSIVE VIDEO =========
     The wrapper locks a 16:9 shape; the iframe fills it. */
  .video-wrap {
    width: 100%;          /* full width of the container */
    aspect-ratio: 16 / 9; /* locks a 16:9 ratio so the video never looks stretched */
    background: #000;     /* black fallback while the video loads */
    border-radius: 12px;
    overflow: hidden;     /* clips the video to the rounded corners */
    margin-bottom: 24px;
  }

  /* The iframe fills the whole wrapper */
  .video-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;            /* removes the default iframe border */
    display: block;
  }

  /* ========= CARDS (MOBILE FIRST) =========
     flex container that stacks the cards in one column on phones. */
  .cards {
    display: flex;          /* makes it a flex container */
    flex-wrap: wrap;        /* lets cards wrap onto new rows */
    flex-direction: column; /* MOBILE: stack cards vertically (1 column) */
    gap: 20px;              /* even space between cards */
  }

  /* Each card */
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .08); /* subtle shadow for depth */
  }

  /* ========= BREAKPOINT 1: TABLET (600px and up) ========= */
  @media (min-width: 600px) {
    body { background: #eef4ff; }   /* light blue = confirms tablet breakpoint is active */
    .cards { flex-direction: row; } /* switch from stacked to side-by-side */
    .card { width: 48%; }           /* ~2 cards per row */
  }

  /* ========= BREAKPOINT 2: DESKTOP (900px and up) ========= */
  @media (min-width: 900px) {
    body { background: #d8ffd8; }   /* light green = confirms desktop breakpoint */
    .card { width: 30%; }           /* ~3 cards per row */
  }

  /* ========= BREAKPOINT 3: LARGE DESKTOP (1200px and up) ========= */
  @media (min-width: 1200px) {
    body { background: #ffe0f0; }   /* light pink = confirms large-desktop breakpoint */
    .container { padding: 28px; }   /* more breathing room on big screens */
    .card { width: 30%; }           /* keep 3 columns on large screens */
  }
  </style>
</head>

<body>
  <!-- .container centers everything and limits the width -->
  <div class="container">

    <h1>Huwa Responsive Media Page</h1>
    <p class="lead">Resize the browser to see the colors and columns change.</p>

    <!-- Responsive image. alt describes the picture (not "image of"). -->
    <img class="rwd-img"
         src="https://picsum.photos/seed/huwa/1200/700"
         alt="A wide scenic landscape photograph used as the page banner">

    <!-- Responsive video (YouTube). The iframe has a title for accessibility.
         Replace VIDEO_ID with your own YouTube video id if you want. -->
    <div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/aqz-KE-bpKQ"
              title="A short sample video about responsive design"
              allowfullscreen></iframe>
    </div>

    <!-- Cards: 1 column on mobile, 2 on tablet, 3 on desktop -->
    <div class="cards">

      <div class="card">
        <h2>Responsive Layout</h2>
        <p>These cards stack in one column on a phone.</p>
      </div>

      <div class="card">
        <h2>Flexible Columns</h2>
        <p>On a tablet the cards line up in two columns.</p>
      </div>

      <div class="card">
        <h2>Desktop View</h2>
        <p>On a desktop the cards spread into three columns.</p>
      </div>

    </div><!-- /.cards -->
  </div><!-- /.container -->
</body>
</html>
